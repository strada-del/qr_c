<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zero Click QR | TAOVERTEX</title>
<!-- TAOVERTEX transparent-logo build: original colors preserved -->
<style>

:root{--bg:#000000;--panel:#080b12;--panel2:#0b1019;--ink:#f7f8ff;--muted:#8993a5;--line:#172033;--blue:#00b8ff;--purple:#8d28ff;--ok:#24d58b;--glow:0 0 28px rgba(0,184,255,.13)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -10%,rgba(60,0,255,.14),transparent 32%),radial-gradient(circle at 100% 35%,rgba(0,184,255,.07),transparent 28%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 74%)}
main{width:min(860px,calc(100% - 28px));margin:0 auto;padding:22px 0 40px;position:relative}
.hero{text-align:center;margin-bottom:22px}
.logo-link{display:flex;width:100%;justify-content:center;align-items:center;margin:0 auto 10px;text-decoration:none;border-radius:18px;outline:none;-webkit-tap-highlight-color:transparent}
.logo-link:focus-visible{box-shadow:0 0 0 3px rgba(0,184,255,.28)}
.brand-logo{display:block;width:min(176px,44vw);height:auto;margin:0 auto;object-fit:contain;image-rendering:auto;filter:none;transform:translateZ(0);backface-visibility:hidden;transition:transform .22s ease,opacity .22s ease,filter .22s ease;cursor:pointer}
.logo-link:hover .brand-logo{transform:scale(1.035) translateZ(0);opacity:.96;filter:drop-shadow(0 0 14px rgba(0,184,255,.18))}
.logo-link:active .brand-logo{transform:scale(.985) translateZ(0)}
.badge{display:inline-flex;gap:8px;align-items:center;padding:7px 13px;border-radius:999px;background:#070a10;border:1px solid #202a3b;color:#bcc5d4;font-size:12px;font-weight:750;letter-spacing:.08em}
.badge:before{content:"⚡";color:#7d4dff}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:18px 0 0;letter-spacing:-.05em;font-weight:850}
.hero h1 span{background:linear-gradient(90deg,var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
.card{position:relative;background:linear-gradient(180deg,rgba(12,17,27,.96),rgba(6,9,15,.96));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--glow),0 22px 70px rgba(0,0,0,.28);overflow:hidden}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(120deg,rgba(0,184,255,.7),transparent 28%,transparent 68%,rgba(141,40,255,.75));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.8}
.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:800;color:#dce4f1}
.type{color:#bfc8ff;background:rgba(102,79,255,.13);border:1px solid rgba(135,92,255,.25);padding:6px 10px;border-radius:999px}
textarea{width:100%;min-height:168px;resize:vertical;border:1px solid #1b2639;border-radius:16px;padding:18px;color:#fff;font:inherit;font-size:17px;line-height:1.7;outline:none;background:#05080e;transition:.2s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.01)}
textarea::placeholder{color:#596476}
textarea:focus{border-color:#00aaff;box-shadow:0 0 0 3px rgba(0,170,255,.08),0 0 30px rgba(108,42,255,.09)}
.hint,.examples,.privacy{display:none}
.qrside{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px 22px}
.qrwrap{width:272px;height:272px;background:#fff;border-radius:22px;display:grid;place-items:center;position:relative;overflow:visible;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 32px rgba(0,184,255,.18),0 0 42px rgba(141,40,255,.10)}
.qrwrap:before,.qrwrap:after{content:"";position:absolute;width:52px;height:52px;pointer-events:none}
.qrwrap:before{left:-14px;top:-14px;border-left:4px solid var(--blue);border-top:4px solid var(--blue);border-radius:9px 0 0 0;filter:drop-shadow(0 0 7px var(--blue))}
.qrwrap:after{right:-14px;bottom:-14px;border-right:4px solid var(--purple);border-bottom:4px solid var(--purple);border-radius:0 0 9px 0;filter:drop-shadow(0 0 7px var(--purple))}
.placeholder{text-align:center;color:#667085;padding:30px;font-size:14px}
.placeholder b{display:block;color:#111827;font-size:34px;margin-bottom:8px}
.qrcode img{display:block!important;width:232px!important;height:232px!important;object-fit:contain;-webkit-touch-callout:default;user-select:auto}
.qrcode{cursor:zoom-in}
.savehint{margin-top:18px;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
.actions{display:grid;grid-template-columns:1fr;gap:10px;width:min(280px,100%);margin-top:14px}
.btn{border:1px solid #25334a;border-radius:14px;padding:13px 14px;font-weight:850;font-size:14px;cursor:pointer}
.primary{background:linear-gradient(90deg,#125cff,#7a2cff);color:#fff;box-shadow:0 10px 30px rgba(74,62,255,.23)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.status{min-height:20px;margin-top:10px;font-size:12px;color:var(--ok);font-weight:800;text-align:center}
.detected{margin-top:6px;color:#9fa9bb;font-size:12px;font-weight:800}
.footer{text-align:center;margin-top:20px;color:#586276;font-size:11px;letter-spacing:.18em}
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal.open{display:flex}
.modalbox{width:min(92vw,560px);background:#070a10;border:1px solid #1d2840;border-radius:24px;padding:20px;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.6),0 0 40px rgba(57,42,255,.18)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:900}
.close{border:1px solid #263148;background:#0d121d;color:#fff;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}
.modalimg{width:min(78vw,460px);height:auto;max-height:65vh;object-fit:contain;background:#fff;border-radius:18px;padding:12px;-webkit-touch-callout:default;user-select:auto}
.modalnote{margin:12px 0 0;color:var(--muted);font-size:13px;font-weight:700}
@media(max-width:760px){main{padding-top:22px}.logo-link{width:100%;justify-content:center}.brand-logo{width:min(112px,29vw);margin:0 auto}.hero{margin-bottom:20px}.card{border-radius:19px;padding:16px}textarea{min-height:165px;font-size:16px}.qrwrap{width:246px;height:246px}.qrcode img{width:210px!important;height:210px!important}}

</style>
</head>

var QR8bitByte = require('./QR8bitByte');
var QRUtil = require('./QRUtil');
var QRPolynomial = require('./QRPolynomial');
var QRRSBlock = require('./QRRSBlock');
var QRBitBuffer = require('./QRBitBuffer');

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

function req(id){
 id=id.replace(/^\.\//,'');
 if(cache[id]) return cache[id].exports;
 if(!modules[id]) throw new Error('Module not found: '+id);
 var module={exports:{}}; cache[id]=module; modules[id](req,module,module.exports); return module.exports;
}
var Core=req('index');
var EC=req('QRErrorCorrectLevel');
function render(text,size){
 size=size||220;
 var qr=new Core(-1,EC.H); qr.addData(String(text)); qr.make();
 var count=qr.getModuleCount(), quiet=4;
 var canvas=document.createElement('canvas');
 var ratio=Math.max(1,Math.floor(window.devicePixelRatio||1));
 canvas.width=size*ratio; canvas.height=size*ratio; canvas.style.width=size+'px'; canvas.style.height=size+'px';
 var ctx=canvas.getContext('2d'); ctx.scale(ratio,ratio); ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
 var total=count+quiet*2, cell=size/total;
 ctx.fillStyle='#111318';
 for(var r=0;r<count;r++) for(var c=0;c<count;c++) if(qr.isDark(r,c)){
   var x=Math.round((c+quiet)*cell), y=Math.round((r+quiet)*cell);
   var x2=Math.round((c+quiet+1)*cell), y2=Math.round((r+quiet+1)*cell);
   ctx.fillRect(x,y,x2-x,y2-y);
 }
 return canvas;
}
global.OfflineQRCode={render:render};
})(window);
</script>
<script>
const input=document.getElementById('input');
const typeEl=document.getElementById('type');
const qrEl=document.getElementById('qrcode');
const qrwrap=document.getElementById('qrwrap');
const placeholder=document.getElementById('placeholder');
const shareBtn=document.getElementById('share');
const statusEl=document.getElementById('status');
const detectedEl=document.getElementById('detected');
const modal=document.getElementById('modal');
const modalImg=document.getElementById('modalImg');
const closeModal=document.getElementById('closeModal');
let timer=null;
let currentDataUrl='';
let currentLabel='';

function classify(raw){
  const v=raw.trim();
  if(!v) return {label:'待機中',value:'',display:''};
  if(/^WIFI:/i.test(v)) return {label:'Wi‑Fi',value:v,display:'Wi‑Fi設定'};
  if(/^https?:\/\//i.test(v)||/^www\./i.test(v)) return {label:'Webサイト',value:/^www\./i.test(v)?'https://'+v:v,display:'🌐 Webサイト'};
  if(/^mailto:/i.test(v)||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return {label:'メール',value:/^mailto:/i.test(v)?v:'mailto:'+v,display:'✉️ メール'};
  if(/^tel:/i.test(v)||/^\+?[0-9０-９()（）\-ー\s]{8,}$/.test(v)) return {label:'電話',value:/^tel:/i.test(v)?v:'tel:'+v.replace(/[\sー]/g,'-'),display:'📞 電話番号'};
  return {label:'テキスト',value:v,display:'📝 テキスト'};
}

function canvasToImage(canvas){
  const img=document.createElement('img');
  img.alt='生成したQRコード';
  img.src=canvas.toDataURL('image/png');
  img.draggable=false;
  return img;
}

function generate(){
  statusEl.textContent='';
  const data=classify(input.value);
  currentLabel=data.label;
  typeEl.textContent=data.label;
  detectedEl.textContent=data.display||'';
  qrEl.innerHTML='';
  currentDataUrl='';
  if(!data.value){
    placeholder.style.display='block';
    placeholder.innerHTML='<b>⌘V</b>貼り付けるだけ';
    shareBtn.disabled=true;
    return;
  }
  placeholder.style.display='none';
  try{
    const canvas=OfflineQRCode.render(data.value,440);
    const img=canvasToImage(canvas);
    currentDataUrl=img.src;
    qrEl.appendChild(img);
    shareBtn.disabled=false;
  }catch(e){
    placeholder.style.display='block';
    placeholder.innerHTML='<b>!</b>文字量が多すぎます';
    shareBtn.disabled=true;
  }
}

function schedule(){clearTimeout(timer);timer=setTimeout(generate,80)}
input.addEventListener('input',schedule);
input.addEventListener('paste',()=>setTimeout(generate,0));
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.v;generate();input.focus()}));

function openQr(){
  if(!currentDataUrl)return;
  modalImg.src=currentDataUrl;
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeQr(){
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
qrwrap.addEventListener('click',openQr);
closeModal.addEventListener('click',closeQr);
modal.addEventListener('click',e=>{if(e.target===modal)closeQr()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQr()});

function dataUrlToBlob(dataUrl){
  const [meta,data]=dataUrl.split(',');
  const mime=(meta.match(/data:(.*?);/)||[])[1]||'image/png';
  const bin=atob(data); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
shareBtn.addEventListener('click',async()=>{
  if(!currentDataUrl)return;
  const file=new File([dataUrlToBlob(currentDataUrl)],'qr-code.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:'QRコード',text:currentLabel+'のQRコード',files:[file]});
      statusEl.textContent='共有メニューを開きました';
    }else{
      openQr();
      statusEl.textContent='画像を長押しして保存してください';
    }
  }catch(e){
    if(e.name!=='AbortError'){
      openQr();
      statusEl.textContent='画像を長押しして保存してください';
    }
  }
  setTimeout(()=>statusEl.textContent='',2200);
});
</script>
</body>
